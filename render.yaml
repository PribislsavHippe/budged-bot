services:
  - type: web
    name: budget-bot
    env: python
    pythonVersion: "3.11.9"
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    # Бесплатный план Render засыпает после 15 мин без запросов.
    # Зарегистрируй сервис на https://uptimerobot.com:
    #   HTTP(s), URL: https://your-app.onrender.com/, интервал 5 минут.
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: WEBHOOK_HOST
        sync: false
      # Google Календарь (OAuth). GOOGLE_REDIRECT_URI = WEBHOOK_HOST + /google/callback
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      # Твой Telegram id — включает /admin и /broadcast
      - key: ADMIN_ID
        sync: false
      # Ссылка на исходники для /privacy
      - key: SOURCE_URL
        sync: false
      - key: WEBHOOK_PATH
        value: /webhook
      - key: WEBAPP_HOST
        value: 0.0.0.0
